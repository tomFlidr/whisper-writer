name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore WhisperWriter.sln

      - name: Build
        run: dotnet build WhisperWriter.sln -c Debug --no-restore -p:SignAssembly=false

      - name: Test
        run: >
          dotnet test WhisperWriter.sln -c Debug --no-build --no-restore
          --logger "console;verbosity=normal" -p:SignAssembly=false
